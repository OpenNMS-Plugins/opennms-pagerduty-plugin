---
version: 2.1

executors:
  build-executor:
    docker:
      - image: cimg/openjdk:17.0.14
        environment:
          MAVEN_OPTS: -Xmx1g
  release-executor:
    docker:
      - image: cimg/base:stable
        environment:
          GH_CLI_VERSION: 2.101.0
          GH_CLI_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8

workflows:
  build-deploy:
    jobs:
      - build:
          filters:
            tags:
              only:
                - /^v.*/
      - publish-github-release:
          context:
            - github-releases
          requires:
            - build
          filters:
            tags:
              only:
                - /^v.*/
            branches:
              ignore: /.*/

jobs:
  build:
    executor: build-executor
    steps:
      - checkout
      - run:
          name: Compile source with tests
          command: make
      - run:
          name: Save test results
          command: |
            mkdir -p ~/junit/
            find . -type f -regex ".*/target/failsafe-reports/.*xml" -exec cp {} ~/junit/ \;
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/junit/ \;
          when: always
      - run:
          name: Collect artifacts
          command: make collect-artifacts
      - store_test_results:
          path: ~/junit
      - store_artifacts:
          path: target/artifacts
      - persist_to_workspace:
          root: ~/
          paths:
            - project

  publish-github-release:
    executor: release-executor
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Install GitHub CLI to create GitHub releases and upload artifacts
          command: |
            curl -fsSLo /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
            echo "${GH_CLI_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
            mkdir -p ~/bin
            tar -xzf /tmp/gh.tar.gz -C /tmp
            mv "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" ~/bin/gh
            ~/bin/gh --version
      - run:
          name: Publish artifacts as GitHub release
          command: |
            export GH_TOKEN="${OPENNMS_PLUGINS_GH_TOKEN:?OPENNMS_PLUGINS_GH_TOKEN is not set}"
            ~/bin/gh auth status --hostname github.com
            ~/bin/gh release create "${CIRCLE_TAG}" target/artifacts/opennms-pagerduty-plugin-*.kar \
              --repo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              --title "${CIRCLE_TAG}" \
              --verify-tag \
              --generate-notes
